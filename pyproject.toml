[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goe-demand-supply"
version = "0.1.0"
description = "Göttingen supermarket real-time demand, supply and inventory forecasting platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "sqlalchemy>=2.0", "pydantic>=2.9",
  "pydantic-settings>=2.5", "httpx>=0.27", "holidays>=0.57", "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
