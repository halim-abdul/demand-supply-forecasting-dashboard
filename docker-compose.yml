services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demand_supply
      POSTGRES_USER: demand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demand"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://demand:${POSTGRES_PASSWORD:-change-me}@postgres:5432/demand_supply
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build: .
    command: streamlit run app/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      DATABASE_URL: postgresql+psycopg://demand:${POSTGRES_PASSWORD:-change-me}@postgres:5432/demand_supply
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH}
    ports: ["8501:8501"]
    depends_on: [api]
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      DEMAND_API_URL: http://api:8000
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n", "./n8n/workflows:/workflows:ro"]
    depends_on: [api]
volumes:
  pgdata:
  n8n_data:
