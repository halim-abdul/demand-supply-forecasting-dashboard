name: CI
on:
  push:
    branches: [main, "feature/**", "research/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check src tests api app scripts
      - run: pytest -q
